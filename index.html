<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GenLayer Staking Motion</title>
<style>
  @font-face { font-family: "Unbounded"; src: url(assets/fonts/Unbounded-500.ttf); font-weight: 500; }
  @font-face { font-family: "Unbounded"; src: url(assets/fonts/Unbounded-700.ttf); font-weight: 700; }
  @font-face { font-family: "Unbounded"; src: url(assets/fonts/Unbounded-900.ttf); font-weight: 900; }
  @font-face { font-family: "JBM"; src: url(assets/fonts/JetBrainsMono-500.ttf); font-weight: 500; }
  @font-face { font-family: "JBM"; src: url(assets/fonts/JetBrainsMono-700.ttf); font-weight: 700; }
  @font-face { font-family: "JBM"; src: url(assets/fonts/JetBrainsMono-800.ttf); font-weight: 800; }
  @font-face { font-family: "SG"; src: url(assets/fonts/SpaceGrotesk-500.ttf); font-weight: 500; }
  @font-face { font-family: "SG"; src: url(assets/fonts/SpaceGrotesk-700.ttf); font-weight: 700; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; }
  #hint { position: fixed; bottom: 12px; left: 0; right: 0; text-align: center; color: #ff87ff;
          font: 500 13px JBM, monospace; letter-spacing: 2px; opacity: .7; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="hint">CLICK TO PLAY WITH SOUND · SPACE = PAUSE · ←/→ = SEEK</div>
<script src="motion.js"></script>
</body>
</html>
