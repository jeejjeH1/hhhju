name: android
on:
  push:
    branches: [claude/secure-browser-extension-support-gqv56o]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Unit tests
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee build.log || { echo '######## ERRORS'; grep -E '^e: |^w: .*Deprecat|error:|What went wrong|FAILED|Unresolved|Tests? .*failed' -A2 build.log | cut -c1-300 | head -120; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: pars-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
