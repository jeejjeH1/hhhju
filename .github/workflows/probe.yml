name: probe
on:
  push:
    branches: [claude/secure-browser-extension-support-gqv56o]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in https://nightly.maven.mozilla.org/maven2/org/mozilla/geckoview/ https://maven.mozilla.org/maven2/org/mozilla/geckoview/ ; do echo "== $u"; curl -sL $u | grep -oE 'geckoview[a-z0-9_-]*/' | sort -u | head -30; done
          for a in geckoview-nightly-arm64-v8a geckoview-arm64-v8a; do for r in https://nightly.maven.mozilla.org/maven2 https://maven.mozilla.org/maven2; do echo "== $r $a"; curl -sL $r/org/mozilla/geckoview/$a/maven-metadata.xml | grep -oE '<(latest|release)>[^<]*' ; done; done
