name: probe
on:
  push:
    branches: [claude/secure-browser-extension-support-gqv56o]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: toolchain
        run: |
          java -version 2>&1 | head -1; echo ANDROID_HOME=$ANDROID_HOME; ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools
      - name: geckoview api
        run: |
          V=158.0.20261007201254
          curl -sL -o g.aar https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a/$V/geckoview-arm64-v8a-$V.aar
          ls -la g.aar; mkdir x && cd x && unzip -q ../g.aar classes.jar AndroidManifest.xml && ls; grep -o 'minSdkVersion[^/]*' AndroidManifest.xml
          for c in 'org.mozilla.geckoview.WebExtension$PermissionPromptResponse' 'org.mozilla.geckoview.WebExtension' 'org.mozilla.geckoview.WebExtension$MetaData' 'org.mozilla.geckoview.GeckoSession$PermissionDelegate$ContentPermission' 'org.mozilla.geckoview.GeckoSession$ProgressDelegate$SecurityInformation' 'org.mozilla.geckoview.StorageController$ClearFlags' 'org.mozilla.geckoview.ContentBlocking$AntiTracking' 'org.mozilla.geckoview.ContentBlocking$EtpLevel' 'org.mozilla.geckoview.ContentBlocking$CookieBehavior' 'org.mozilla.geckoview.ContentBlocking$SafeBrowsing' 'org.mozilla.geckoview.GeckoSession$NavigationDelegate$LoadRequest' 'org.mozilla.geckoview.WebMessage' 'org.mozilla.geckoview.GeckoSession$PermissionDelegate$Callback' 'org.mozilla.geckoview.GeckoSession$PermissionDelegate$MediaSource' 'org.mozilla.geckoview.GeckoResult' 'org.mozilla.geckoview.AllowOrDeny' 'org.mozilla.geckoview.GeckoSessionSettings$Builder' 'org.mozilla.geckoview.GeckoSession' 'org.mozilla.geckoview.GeckoRuntime' 'org.mozilla.geckoview.WebExtension$Image' 'org.mozilla.geckoview.Image'; do echo "=== $c"; javap -constants -cp classes.jar "$c" 2>&1 | grep -v "^Compiled" | grep -iE "class|interface|PermissionPromptResponse|static final|MetaData|isEnabled|isBuiltIn|id;|name;|description|version|icon|getBitmap|isSecure|origin|host|uri;|permission|value|ALL|fromValue|accept|complete|setActionDelegate|setActionDelegate|getWebExtensionController|create\(|usePrivate|open\(|loadUri|setContentDelegate|setProgressDelegate|setNavigationDelegate|setPermissionDelegate|setContentBlockingDelegate|goBack|goForward|reload|stop|close|getSettings|isOpen|restoreState|getHeaders|headers|LoadRequest|target|isRedirect|isDirectNavigation|setPreferredColorScheme|SessionState|getText|Bitmap" | head -60; done 2>&1 | cut -c1-200
