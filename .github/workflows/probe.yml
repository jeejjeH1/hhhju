name: probe
on:
  push:
    branches: [claude/secure-browser-extension-support-gqv56o]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          V=158.0.20261007201254
          curl -sL -o g.aar https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a/$V/geckoview-arm64-v8a-$V.aar
          mkdir x && cd x && unzip -q ../g.aar classes.jar
          for c in 'WebExtension$MessageDelegate' 'WebExtension$Port' 'WebExtension$PortDelegate' 'WebExtension$MessageSender' 'WebExtension$SessionController'; do echo "== $c"; javap -cp classes.jar "org.mozilla.geckoview.$c" | grep -E "public|default|interface|class" | grep -v "^Compiled" | cut -c1-220 | head -14; done
          echo "== Ctl"; javap -cp classes.jar org.mozilla.geckoview.WebExtensionController | grep -E "ensureBuiltIn|installBuiltIn|EnableSource" | cut -c1-200
          echo "== WE"; javap -cp classes.jar org.mozilla.geckoview.WebExtension | grep -E "setMessageDelegate|getMessageDelegate" | cut -c1-200
          true
