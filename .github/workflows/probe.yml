name: probe
on:
  push:
    branches: [claude/secure-browser-extension-support-gqv56o]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          V=158.0.20261007201254
          curl -sL -o g.aar https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a/$V/geckoview-arm64-v8a-$V.aar
          mkdir x && cd x && unzip -q ../g.aar classes.jar
          for c in 'WebExtension$TabDelegate' 'WebExtension$SessionController' 'WebExtension$CreateTabDetails' 'WebExtension$Action'; do echo "== $c"; javap -cp classes.jar "org.mozilla.geckoview.$c" | grep -E "public|default|void|Result" | grep -v "^Compiled" | cut -c1-230 | head -22; done
          echo "== SessionSettings"; javap -constants -cp classes.jar org.mozilla.geckoview.GeckoSessionSettings | grep -iE "USER_AGENT_MODE|VIEWPORT_MODE|setUserAgentMode|setViewportMode|setUserAgentOverride|setUsePrivateMode" | cut -c1-200
          echo "== RuntimeSettings"; javap -constants -cp classes.jar org.mozilla.geckoview.GeckoRuntimeSettings | grep -iE "COLOR_SCHEME|setFontSizeFactor|setPreferredColorScheme|setFontInflation|setForceUserScalable|setWebFonts" | cut -c1-200
          true
