name: probe
on:
  push:
    branches: [claude/secure-browser-extension-support-gqv56o]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          V=158.0.20261007201254
          curl -sL -o g.aar https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a/$V/geckoview-arm64-v8a-$V.aar
          mkdir x && cd x && unzip -q ../g.aar classes.jar
          echo "== LogEntry"; for c in "ContentBlockingController\$LogEntry" "ContentBlockingController\$LogEntry\$BlockingData" "ContentBlockingController\$TrackingDbEvent"; do echo "-- $c"; javap -cp classes.jar "org.mozilla.geckoview.$c" | grep -E "public|static" | cut -c1-190; done
          true
