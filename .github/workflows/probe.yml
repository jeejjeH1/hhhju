name: probe
on:
  push:
    branches: [claude/secure-browser-extension-support-gqv56o]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: toolchain
        run: |
          java -version 2>&1 | head -1; gradle -v | grep ^Gradle; echo ANDROID_HOME=$ANDROID_HOME; ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools
      - name: geckoview api
        run: |
          V=158.0.20261007201254
          curl -sL -o g.aar https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a/$V/geckoview-arm64-v8a-$V.aar
          ls -la g.aar; mkdir x && cd x && unzip -q ../g.aar classes.jar AndroidManifest.xml && ls; grep -o 'minSdkVersion[^/]*' AndroidManifest.xml
          for c in 'org.mozilla.geckoview.GeckoSession$ContentDelegate' 'org.mozilla.geckoview.GeckoSession$NavigationDelegate' 'org.mozilla.geckoview.GeckoSession$ProgressDelegate' 'org.mozilla.geckoview.GeckoSession$PermissionDelegate' 'org.mozilla.geckoview.GeckoSession$PermissionDelegate$MediaCallback' 'org.mozilla.geckoview.ContentBlocking$Delegate' 'org.mozilla.geckoview.ContentBlocking$BlockEvent' 'org.mozilla.geckoview.WebExtensionController' 'org.mozilla.geckoview.WebExtensionController$PromptDelegate' 'org.mozilla.geckoview.WebExtension$ActionDelegate' 'org.mozilla.geckoview.WebExtension$Action' 'org.mozilla.geckoview.GeckoRuntimeSettings$Builder' 'org.mozilla.geckoview.GeckoRuntimeSettings' 'org.mozilla.geckoview.StorageController' 'org.mozilla.geckoview.WebResponse' 'org.mozilla.geckoview.GeckoView' 'org.mozilla.geckoview.ContentBlocking$Settings$Builder'; do echo "=== $c"; javap -cp classes.jar "$c" | grep -v "^Compiled" ; done 2>&1 | cut -c1-230
