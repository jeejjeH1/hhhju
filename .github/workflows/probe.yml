name: probe
on:
  push:
    branches: [claude/secure-browser-extension-support-gqv56o]
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          V=158.0.20261007201254
          curl -sL -o g.aar https://maven.mozilla.org/maven2/org/mozilla/geckoview/geckoview-arm64-v8a/$V/geckoview-arm64-v8a-$V.aar
          mkdir x && cd x && unzip -q ../g.aar classes.jar
          for c in org.mozilla.geckoview.GeckoPreferenceController 'org.mozilla.geckoview.GeckoPreferenceController$SetGeckoPreference' 'org.mozilla.geckoview.GeckoPreferenceController$GetGeckoPreference' ; do echo "== $c"; javap -cp classes.jar "$c" 2>&1 | grep -E "class|public|static" | cut -c1-210 | head -25; done
          echo "== config"; javap -p -cp classes.jar org.mozilla.geckoview.GeckoRuntime | grep -iE "config|yaml" | cut -c1-200; unzip -p classes.jar org/mozilla/geckoview/GeckoRuntime.class | strings | grep -iE "geckoview-config|configFile|yaml|prefs" | head
          true
